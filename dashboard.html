<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SecPay — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <!-- QR Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --accent: #007bff;
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #222;
      --muted: #666;
      --danger: #e74c3c;
      --success: #28a745;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 15px;
    }

    .wrap {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
      border: 1px solid rgba(0,0,0,0.05);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    h1 {
      color: var(--accent);
      font-size: 1.5rem;
    }

    .balance {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--success);
    }

    code {
      background: rgba(0,0,0,0.05);
      padding: 2px 6px;
      border-radius: 5px;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 600;
      position: relative;
      overflow: hidden;
    }
    button:hover { background: #0064d4; }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 5px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
    }

    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,123,255,0.1); }

    #receiverName {
      color: var(--accent);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    #qrcode {
      margin: 10px auto 15px;
      display: flex;
      justify-content: center;
    }

    #scanArea {
      display: none;
      margin-top: 10px;
    }

    #reader {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #ccc;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li.item {
      display: flex;
      flex-direction: column;
      padding: 10px 0;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    li .amt {
      font-weight: bold;
    }
    li .amt.debit { color: var(--danger); }
    li .amt.credit { color: var(--success); }
    li .muted { color: var(--muted); font-size: 0.8rem; }

    #toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 9999;
    }
    #toast.show { opacity: 1; }

    /* Button loading animation */
    button.loading::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      border: 2px solid white;
      border-top: 2px solid transparent;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: spin 1s linear infinite;
    }
    button.loading { pointer-events: none; opacity: 0.6; }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Payment confirmation modal */
    #confirmBox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(4px);
    }
    #confirmBox.active { display: flex; }

    .confirm-card {
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      max-width: 300px;
      width: 90%;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
      animation: pop 0.25s ease;
    }
    .confirm-card h3 {
      color: var(--accent);
      margin-bottom: 10px;
    }
    .confirm-card p {
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .actions button {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .actions button.cancel {
      background: #ccc;
      color: #000;
    }
    .actions button:not(.cancel) {
      background: var(--accent);
      color: #fff;
    }
    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 480px) {
      body { padding: 20px; }
      .balance { font-size: 1.5rem; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- PROFILE CARD -->
    <div class="card">
      <div class="top">
        <div>
          <h1>💳 SecPay</h1>
          <p>Welcome, <b id="userName">—</b></p>
          <p>Your UID: <code id="userUid">—</code>
            <button id="copyUid">Copy</button>
          </p>
        </div>
        <div class="balance">₹<span id="balance">0</span></div>
      </div>

      <div id="qrcode"></div>
      <button id="logoutBtn" style="width:100%;margin-top:10px;">Logout</button>
    </div>

    <!-- SEND MONEY CARD -->
    <div class="card">
      <h2>Send Money (by UID)</h2>
      <input id="receiverUid" placeholder="Receiver UID">
      <div id="receiverName">—</div>
      <input id="amount" type="number" placeholder="Amount (₹)">
      <div style="display:flex;gap:10px;">
        <button id="sendBtn" style="flex:1;">Send</button>
        <button id="scanQrBtn" style="flex:1;background:#28a745;">📷 Scan QR</button>
      </div>

      <div id="scanArea">
        <div id="reader"></div>
        <button id="closeScan" style="margin-top:8px;width:100%;background:#ccc;color:#000;">Close Scanner</button>
      </div>
    </div>

    <!-- HISTORY CARD -->
    <div class="card">
      <h2>Transaction History</h2>
      <ul id="txnList">
        <li class="item">Loading transactions...</li>
      </ul>
    </div>
  </div>

  <!-- Payment Confirmation Popup -->
  <div id="confirmBox">
    <div class="confirm-card">
      <h3>💸 Confirm Payment</h3>
      <p>Are you sure you want to send <b id="confirmAmount">₹0</b> to <b id="confirmName">—</b>?</p>
      <div class="actions">
        <button id="confirmYes">Yes, Send</button>
        <button id="confirmNo" class="cancel">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="dashboard.js"></script>

  <!-- QR + Receiver Name + Send Animation Integration -->
  <script type="module">
    import { db } from "./firebase.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    let qrGen, qrScanner;
    const receiverInput = document.getElementById("receiverUid");
    const receiverNameDiv = document.getElementById("receiverName");
    const sendBtn = document.getElementById("sendBtn");

    function generateQRCode(uid) {
      const qrDiv = document.getElementById("qrcode");
      qrDiv.innerHTML = "";
      if (!uid) return;
      qrGen = new QRCode(qrDiv, {
        text: uid,
        width: 140,
        height: 140,
        colorDark: "#007bff",
        colorLight: "#ffffff"
      });
    }

    const observer = new MutationObserver(() => {
      const uid = document.getElementById("userUid").textContent.trim();
      if (uid && uid !== "—") generateQRCode(uid);
    });
    observer.observe(document.getElementById("userUid"), { childList: true });

    const scanBtn = document.getElementById("scanQrBtn");
    const scanArea = document.getElementById("scanArea");
    const closeScan = document.getElementById("closeScan");

    scanBtn.onclick = () => {
      scanArea.style.display = "block";
      qrScanner = new Html5Qrcode("reader");
      qrScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 200 },
        (decodedText) => {
          receiverInput.value = decodedText;
          qrScanner.stop();
          scanArea.style.display = "none";
          const t = document.getElementById("toast");
          t.textContent = "UID Scanned ✅";
          t.classList.add("show");
          setTimeout(()=>t.classList.remove("show"), 2000);
          fetchReceiverName(decodedText);
        },
        (err) => {}
      );
    };

    closeScan.onclick = () => {
      if (qrScanner) qrScanner.stop();
      scanArea.style.display = "none";
    };

    receiverInput.addEventListener("input", () => {
      const uid = receiverInput.value.trim();
      fetchReceiverName(uid);
    });

    async function fetchReceiverName(uid) {
      if (!uid) {
        receiverNameDiv.textContent = "—";
        return;
      }
      try {
        const snap = await getDoc(doc(db, "users", uid));
        receiverNameDiv.textContent = snap.exists() ? snap.data().fullName : "❌ Not found";
      } catch (e) {
        receiverNameDiv.textContent = "Error fetching name";
      }
    }

    // Confirm modal elements
    const confirmBox = document.getElementById("confirmBox");
    const confirmAmount = document.getElementById("confirmAmount");
    const confirmName = document.getElementById("confirmName");
    const confirmYes = document.getElementById("confirmYes");
    const confirmNo = document.getElementById("confirmNo");

    sendBtn.addEventListener("click", () => {
      const amount = document.getElementById("amount").value.trim();
      const receiver = receiverNameDiv.textContent.trim();

      if (!amount || !receiver || receiver === "—" || receiver === "❌ Not found") {
        alert("Enter valid receiver and amount first.");
        return;
      }

      confirmAmount.textContent = `₹${amount}`;
      confirmName.textContent = receiver;
      confirmBox.classList.add("active");
    });

    confirmYes.onclick = async () => {
      confirmBox.classList.remove("active");
      sendBtn.classList.add("loading");
      try {
        await new Promise(r => setTimeout(r, 2000));
        const t = document.getElementById("toast");
        t.textContent = "✅ Payment Sent Successfully";
        t.classList.add("show");
        setTimeout(()=>t.classList.remove("show"), 2500);
      } catch (e) {
        alert("Payment failed: " + e.message);
      }
      sendBtn.classList.remove("loading");
    };

    confirmNo.onclick = () => {
      confirmBox.classList.remove("active");
    };
  </script>
</body>
</html>
