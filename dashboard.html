<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SecPay — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 20px;
      color: #222;
    }
    .wrap { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .top { display: flex; justify-content: space-between; align-items: center; }
    .balance { font-size: 1.8em; font-weight: bold; color: #0d6efd; }
    input {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
    }
    button {
      background: #0d6efd;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    ul { list-style: none; padding: 0; margin: 0; }
    .item { border-bottom: 1px solid #eee; padding: 8px 0; }
    .amt { font-weight: bold; }
    .debit { color: red; }
    .credit { color: green; }
    .muted { font-size: 0.8em; color: gray; display: block; }
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #toast.show { opacity: 1; }
    #qrBox {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }
    canvas { margin-top: 10px; }
    #qrScanner { display: none; width: 100%; }
    #sendingOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.9);
      justify-content: center; align-items: center;
      font-size: 1.5em;
      color: #0d6efd;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div>
          <h1>💳 SecPay</h1>
          <p>Welcome, <b id="userName">—</b></p>
          <p>Your UID: <code id="userUid">—</code> <button id="copyUid">Copy</button></p>
        </div>
        <div class="balance">₹<span id="balance">0</span></div>
      </div>
      <div id="qrBox">
        <canvas id="qrCanvas"></canvas>
        <button id="scanBtn">📷 Scan UID</button>
        <div id="qrScanner"></div>
      </div>
      <button id="logoutBtn">Logout</button>
    </div>

    <div class="card">
      <h2>Send Money</h2>
      <input id="receiverUid" placeholder="Receiver UID">
      <div id="receiverName" style="margin-bottom:10px; color:gray;">—</div>
      <input id="amount" type="number" placeholder="Amount (₹)">
      <button id="sendBtn">Send</button>
    </div>

    <div class="card">
      <h2>History</h2>
      <ul id="txnList"></ul>
    </div>
  </div>

  <div id="sendingOverlay">💸 Sending...</div>
  <div id="toast"></div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import {
      onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      doc, getDoc, onSnapshot, runTransaction, collection, query, where,
      orderBy, serverTimestamp, onSnapshot as listen
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    import QrCreator from "https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js";

    let meUid = null;
    let meRef = null;

    const toast = (msg) => {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    };

    // Auth and profile
    onAuthStateChanged(auth, async (user) => {
      if (!user) return (window.location.href = "index.html");
      meUid = user.uid;
      meRef = doc(db, "users", meUid);

      // Realtime profile
      onSnapshot(meRef, (snap) => {
        if (!snap.exists()) return;
        const u = snap.data();
        document.getElementById("userName").textContent = u.fullName ?? "User";
        document.getElementById("balance").textContent = u.balance ?? 0;
        document.getElementById("userUid").textContent = meUid;

        // Generate QR for UID
        const qr = new QRious({
          element: document.getElementById("qrCanvas"),
          value: meUid,
          size: 150,
        });
      });

      document.getElementById("copyUid").onclick = () => {
        navigator.clipboard.writeText(meUid);
        toast("UID copied ✅");
      };

      startHistoryListeners();
    });

    // Logout
    document.getElementById("logoutBtn").onclick = async () => {
      await signOut(auth);
      window.location.href = "index.html";
    };

    // Auto fetch receiver name
    document.getElementById("receiverUid").addEventListener("input", async (e) => {
      const uid = e.target.value.trim();
      if (uid.length < 6) {
        document.getElementById("receiverName").textContent = "—";
        return;
      }
      const rxSnap = await getDoc(doc(db, "users", uid));
      document.getElementById("receiverName").textContent = rxSnap.exists() ? rxSnap.data().fullName : "❌ Not found";
    });

    // Send money
    document.getElementById("sendBtn").onclick = async () => {
      const receiverUid = document.getElementById("receiverUid").value.trim();
      const amount = parseFloat(document.getElementById("amount").value);
      if (!receiverUid || !amount || amount <= 0) return toast("Enter valid details");
      if (receiverUid === meUid) return toast("Can't send to yourself");

      const overlay = document.getElementById("sendingOverlay");
      overlay.style.display = "flex";
      const rxRef = doc(db, "users", receiverUid);
      const rxSnap = await getDoc(rxRef);
      if (!rxSnap.exists()) {
        overlay.style.display = "none";
        return toast("Receiver not found");
      }

      try {
        await runTransaction(db, async (tx) => {
          const meDoc = await tx.get(meRef);
          const rxDoc = await tx.get(rxRef);
          const meBal = Number(meDoc.data().balance || 0);
          const rxBal = Number(rxDoc.data().balance || 0);
          if (meBal < amount) throw new Error("Insufficient balance");

          tx.update(meRef, { balance: meBal - amount });
          tx.update(rxRef, { balance: rxBal + amount });

          const txnRef = doc(collection(db, "transactions"));
          tx.set(txnRef, {
            senderId: meUid,
            senderName: meDoc.data().fullName,
            receiverId: receiverUid,
            receiverName: rxDoc.data().fullName,
            amount,
            createdAt: serverTimestamp()
          });
        });
        toast("✅ Payment sent");
        document.getElementById("receiverUid").value = "";
        document.getElementById("amount").value = "";
        document.getElementById("receiverName").textContent = "—";
      } catch (e) {
        toast(e.message);
      } finally {
        overlay.style.display = "none";
      }
    };

    // History listener
    function startHistoryListeners() {
      const list = document.getElementById("txnList");
      const items = new Map();

      function render() {
        const arr = Array.from(items.values()).sort((a, b) => {
          const ta = a.createdAt?.toMillis?.() ?? 0;
          const tb = b.createdAt?.toMillis?.() ?? 0;
          return tb - ta;
        });
        list.innerHTML = arr.length ? "" : "<li class='item'>No transactions yet.</li>";
        for (const t of arr) {
          const li = document.createElement("li");
          li.className = "item";
          const when = t.createdAt?.toDate?.().toLocaleString?.() ?? "";
          const isSent = t.senderId === meUid;
          li.innerHTML = isSent
            ? `<span class='amt debit'>− ₹${t.amount}</span> to <b>${t.receiverName}</b> <span class='muted'>${when}</span>`
            : `<span class='amt credit'>+ ₹${t.amount}</span> from <b>${t.senderName}</b> <span class='muted'>${when}</span>`;
          list.appendChild(li);
        }
      }

      const qSent = query(collection(db, "transactions"), where("senderId", "==", meUid));
      const qRecv = query(collection(db, "transactions"), where("receiverId", "==", meUid));

      listen(qSent, (snap) => {
        snap.docChanges().forEach(ch => items.set(ch.doc.id, ch.doc.data()));
        render();
      });
      listen(qRecv, (snap) => {
        snap.docChanges().forEach(ch => items.set(ch.doc.id, ch.doc.data()));
        render();
      });
    }

    // QR Scanner
    let scannerOpen = false;
    document.getElementById("scanBtn").onclick = () => {
      const qrDiv = document.getElementById("qrScanner");
      if (scannerOpen) {
        qrDiv.innerHTML = "";
        qrDiv.style.display = "none";
        scannerOpen = false;
        return;
      }
      qrDiv.style.display = "block";
      const html5QrCode = new Html5Qrcode("qrScanner");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => {
          document.getElementById("receiverUid").value = decodedText;
          html5QrCode.stop();
          qrDiv.style.display = "none";
          scannerOpen = false;
          toast("UID Scanned ✅");
        },
        (err) => {}
      );
      scannerOpen = true;
    };
  </script>
</body>
</html>
